name: Bug report
description: Report a reproducible problem without sharing private Telegram data.
title: "[bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Default Mode
        - MCP server
        - Power Mode
        - Control-plane
        - Operator Workflows
        - Mirror/archive
        - Subscriber export
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use redacted commands and synthetic examples. Do not include private Telegram content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Paste redacted test or smoke output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, sessions, phone numbers, private chat content, media, archive DBs, and subscriber exports.
          required: true
