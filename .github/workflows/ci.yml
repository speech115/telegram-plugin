name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test MCP package
        working-directory: mcp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest -q
          python -m compileall -q src tests
      - name: Test control-plane package
        working-directory: control-plane
        env:
          TELEGRAM_CI_PORTABLE: "1"
          TELEGRAM_MONOREPO_ROOT: ${{ github.workspace }}
          TELEGRAM_CONTROL_PLANE_ROOT: ${{ github.workspace }}/control-plane
          TELEGRAM_MCP_REPO: ${{ github.workspace }}/mcp
          TELEGRAM_PLUGIN_SOURCE: ${{ github.workspace }}/plugin
          TELEGRAM_PLUGIN_PACKAGE: ${{ github.workspace }}/plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
          python -m compileall -q src tests

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portable fresh-install smoke and release gate
        run: |
          chmod +x scripts/*.sh control-plane/bin/*
          ./scripts/fresh-install-smoke.sh