# Local Prometheus scrape config for Telegram MCP telemetry exporters.
# Copy or include from your Prometheus prometheus.yml scrape_configs.

scrape_configs:
  - job_name: telegram-mcp-metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 127.0.0.1:9109
        labels:
          profile: default
      - targets:
          - 127.0.0.1:9110
        labels:
          profile: pl
      - targets:
          - 127.0.0.1:9111
        labels:
          profile: recklessou
      - targets:
          - 127.0.0.1:9112
        labels:
          profile: teamsyncsage
      - targets:
          - 127.0.0.1:9113
        labels:
          profile: vermassov
