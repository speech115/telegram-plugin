name: telegram-control-plane

on:
  push:
    paths:
      - "**.py"
      - "bin/**"
      - "policy/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/control-plane.yml"
  pull_request:
    paths:
      - "**.py"
      - "bin/**"
      - "policy/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/control-plane.yml"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CI release gate
        run: ./bin/telegram-release-gate --ci