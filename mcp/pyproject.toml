[project]
name = "telegram-mcp"
version = "0.1.0"
description = "Telegram MCP server for Claude Code — read chats, send messages, search, manage contacts and media"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "telethon>=1.44.0",
    "cryptg>=0.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
tdlib = [
    "Pytdbot>=0.10.1",
    "tdjson>=1.8.65",
]

[project.scripts]
telegram-mcp = "telegram_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
